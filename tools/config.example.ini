# ============================================================
# 前沿生物追踪 · 邮箱配置（仅保存在本机，不要外传）
#
# 授权码获取（只有你能操作）：
#   1. 网页登录 mail.163.com
#   2. 设置 → POP3/SMTP/IMAP
#   3. 开启「SMTP 服务」（按提示短信验证）
#   4. 生成授权码并复制，粘贴替换下面 password 一行
#
# 注意：password 填的是【授权码】，不是邮箱登录密码。
# ============================================================

[email]
smtp_host = smtp.163.com
smtp_port = 465
sender   = you@example.com
password = YOUR_SMTP_AUTH_CODE
receiver = you@example.com
